nseeds: 32

tls_composite:
  data_root: ../../../data/troupe
  preprocessing_root: data
  figure_root: figures
  datasets:
    - TLS
    - TLSC
  state_names:
    - NMPs
    - Somite
    - NeuralTube
  likelihood_fractions:
    - 0.5
    - 0.1
    - 1.0e-5
    - 1.0e-10
    - 1.0e-25
  preprocessing:
    profile_grid_points: 121
    rate_epsilon: 1.0e-8
    probability_epsilon: 1.0e-8
    max_birth_rate: 20.0
  files:
    profiles: composite_parameter_profiles.csv
    ranges: composite_parameter_value_ranges.csv
    metadata: composite_parameter_metadata.csv
  plotting:
    output_basename: TLS_vs_TLSC_composite_sensitivity_compact
    parameter_output_basenames:
      birth: TLS_vs_TLSC_birth_rates
      death: TLS_vs_TLSC_death_rates
      transition: TLS_vs_TLSC_transition_probabilities
      sampling: TLS_vs_TLSC_sampling_rates
    formats:
      - pdf
      - svg
    # Profile-grid support cutoff; these are not replicate-level samples.
    boxplot_likelihood_fraction: 0.1
    whisker_likelihood_fraction: 1.0e-5
    figsize:
      - 14.0
      - 4.2
    parameter_figsize:
      - 6.5
      - 4.2
    group_spacing: 1.15
    dataset_offset: 0.23
    box_width: 0.34
    x_limits:
      - -0.48
      - 2.78
    single_group_x_limits:
      - -0.52
      - 0.52
    font_size: 16
    font_family: Arial
    math_fontset: stixsans
    dataset_colors:
      TLS: "#6f91bd"
      TLSC: "#e49a78"
