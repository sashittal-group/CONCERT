sgootr_profiles:
  data_root: ../../../data/sgootr/processed
  preprocessing_root: data
  figure_root: figures
  datasets:
    - birth_shifted_min_branch
    - transition_anchored
    - upgma_min_subtracted_height_1
    - upgma_min_subtracted_height_1_transition_cut_upgma
  state_names:
    - NC
    - PT
    - LN
  likelihood_fractions:
    - 0.5
    - 0.1
    - 1.0e-5
    - 1.0e-10
    - 1.0e-25
  preprocessing:
    profile_grid_points: 121
    rate_epsilon: 1.0e-8
    probability_epsilon: 1.0e-8
    max_birth_rate: 50.0
  files:
    profiles: parameter_profiles.csv
    ranges: parameter_value_ranges.csv
    metadata: parameter_metadata.csv
  plotting:
    output_basename: SGOOTR_composite_sensitivity_compact
    parameter_output_basenames:
      birth: SGOOTR_birth_rates
      death: SGOOTR_death_rates
      transition: SGOOTR_transition_probabilities
      sampling: SGOOTR_sampling_rates
    formats:
      - pdf
      - svg
    boxplot_likelihood_fraction: 0.1
    whisker_likelihood_fraction: 1.0e-5
    figsize:
      - 16.0
      - 4.2
    composite_bottom: 0.25
    composite_wspace: 0.08
    parameter_figsize:
      - 5.8
      - 4.2
    group_spacing: 1.15
    dataset_offset: 0.42
    box_width: 0.14
    x_limits:
      - -0.50
      - 2.80
    single_group_x_limits:
      - -0.52
      - 0.52
    font_size: 16
    dataset_label_font_size: 13
    dataset_label_rotation: 45
    font_family: Arial
    math_fontset: stixsans
    dataset_colors:
      birth_shifted_min_branch: "#6f91bd"
      transition_anchored: "#e49a78"
      upgma_min_subtracted_height_1: "#7b9e69"
      upgma_min_subtracted_height_1_transition_cut_upgma: "#b07aa1"
    state_colors:
      NC: "#6f91bd"
      PT: "#e49a78"
      LN: "#7b9e69"
    dataset_labels:
      birth_shifted_min_branch: "Min BL"
      transition_anchored: "Rational"
      upgma_min_subtracted_height_1: "UPGMA h=1"
      upgma_min_subtracted_height_1_transition_cut_upgma: "UPGMA below latest transition"
    composite_panel_types:
      - growth
      - transition
      - scaled_sampling
