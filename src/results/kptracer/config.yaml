kptracer_profiles:
  data_root: ../../../data/KPTracer-Data/processed_data
  preprocessing_root: data
  figure_root: figures
  datasets:
    - KPTracer
  state_names:
    - T1
    - L1
    - L2
    - L3
    - S1
  likelihood_fractions:
    - 0.5
    - 0.1
    - 1.0e-5
    - 1.0e-10
    - 1.0e-25
  preprocessing:
    profile_grid_points: 121
    rate_epsilon: 1.0e-8
    probability_epsilon: 1.0e-8
    max_birth_rate: 10000000000.0
    rate_profile_growth_span: 5.0
  files:
    profiles: parameter_profiles.csv
    ranges: parameter_value_ranges.csv
    metadata: parameter_metadata.csv
  plotting:
    output_basename: KPTracer_composite_sensitivity_compact
    parameter_output_basenames:
      birth: KPTracer_birth_rates
      death: KPTracer_death_rates
      transition: KPTracer_transition_probabilities
      sampling: KPTracer_sampling_rates
    formats:
      - pdf
      - svg
    boxplot_likelihood_fraction: 0.1
    whisker_likelihood_fraction: 1.0e-5
    figsize:
      - 16.0
      - 4.2
    parameter_figsize:
      - 10.0
      - 4.2
    group_spacing: 1.15
    dataset_offset: 0.23
    box_width: 0.34
    x_limits:
      - -0.48
      - 5.08
    single_group_x_limits:
      - -0.52
      - 0.52
    font_size: 15
    dataset_label_font_size: 11
    font_family: Arial
    math_fontset: stixsans
    dataset_colors:
      KPTracer: "#6f91bd"
    composite_excluded_parameters:
      scaled_sampling:
        - scaled_sampling[L1]
    transition_plot_style: heatmap
    transition_heatmap_colormap: Blues
    transition_heatmap_x_label: Destination
    transition_heatmap_y_label: Source
    transition_heatmap_figsize:
      - 6.0
      - 5.2
    log_scale_parameter_types:
      - birth
      - death
    composite_panel_types:
      - growth
      - transition
      - scaled_sampling
